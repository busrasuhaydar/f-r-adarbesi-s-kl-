<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tubes Cursor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <div id="canvas"></div>
        <a href="#">Click to change colors</a>
    </div>
    <script type="module">
        import { Tubes1Cursor } from "https://cdn.jsdelivr.net/npm/threejs-components@latest/build/module.cdn.min.js"

        const app = Tubes1Cursor(document.getElementById('canvas'), {
          tubes: {
            colors: ["#f967fb", "#53bc28", "#6958d5"],
            lights: {
              intensity: 200,
              colors: ["#83f36e", "#fe8a2e", "#ff008a", "#60aed5"]
            }
          }
        })

        document.body.addEventListener('click', () => {
          const colors = randomColors(3)
          const lightsColors = randomColors(4)
          console.log(colors, lightsColors)
          app.tubes.setColors(colors)
          app.tubes.setLightsColors(lightsColors)
        })

        function randomColors (count) {
            return new Array(count)
                .fill(0)
                .map(() => "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0'))
        }
    </script>
</body>
</html>
