<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tubes Cursor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html, #app {
          margin: 0;
          width: 100%;
          height: 100%;
        }

        body {
          touch-action: none;
        }

        #app {
          height: 100%;
          font-family: "Montserrat", serif;
        }

        #canvas {
          position: fixed;
          top: 0;
          right: 0;
          bottom: 0;
          left: 0;
          overflow: hidden;
        }

        a {
          position: fixed;
          bottom: 30px;
          left: 50%;
          transform: translateX(-50%);
          color: #fff;
          text-decoration: none;
          text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="canvas"></div>
        <a href="#">Click to change colors</a>
    </div>
    <script type="module">
        try {
            console.log('Script started...');

            const module = await import("https://unpkg.com/threejs-components@latest/build/module.cdn.min.js");
            console.log('Module loaded:', module);
            console.log('Tubes1Cursor:', module.Tubes1Cursor);

            const { Tubes1Cursor } = module;

            const canvasElement = document.getElementById('canvas');
            console.log('Canvas element:', canvasElement);

            const app = Tubes1Cursor(canvasElement, {
              tubes: {
                colors: ["#f967fb", "#53bc28", "#6958d5"],
                lights: {
                  intensity: 200,
                  colors: ["#83f36e", "#fe8a2e", "#ff008a", "#60aed5"]
                }
              }
            });

            console.log('App initialized:', app);

            document.body.addEventListener('click', () => {
              const colors = randomColors(3);
              const lightsColors = randomColors(4);
              console.log('New colors:', colors, lightsColors);
              app.tubes.setColors(colors);
              app.tubes.setLightsColors(lightsColors);
            });

            function randomColors (count) {
                return new Array(count)
                    .fill(0)
                    .map(() => "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0'));
            }

            console.log('✅ Everything loaded successfully!');
        } catch (error) {
            console.error('❌ Error:', error);
            document.body.innerHTML += `<div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border: 2px solid red; border-radius: 10px; max-width: 80%; z-index: 9999;">
                <h2 style="color: red; margin: 0 0 10px 0;">Hata / Error</h2>
                <p style="margin: 0; font-family: monospace; color: black;">${error.message}</p>
                <p style="margin: 10px 0 0 0; font-size: 12px; color: #666;">
                    Lütfen tarayıcı konsolunu kontrol edin veya HTTP server ile açın.<br>
                    Please check browser console or open with HTTP server.
                </p>
            </div>`;
        }
    </script>
</body>
</html>
