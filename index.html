<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Infinity Race v5 - 3 KELİME = 1 SATIR - Mobile & VR</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 32px;
            font-family: Arial, sans-serif;
            text-align: center;
            line-height: 1.5;
        }
        
        /* 📱 MOBİL KONTROLLER */
        .mobile-controls {
            position: fixed;
            pointer-events: none;
            z-index: 100;
        }
        
        /* 📷 CAMERA MODE BUTTON - SOL ÜST */
        #cameraBtn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 50px;  /* 60→50 */
            height: 50px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;  /* 28→24 */
            cursor: pointer;
            transition: all 0.2s;
            z-index: 101;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        #cameraBtn:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.95);
        }
        
        /* 🎮 STEERING - SOL ALT */
        #steeringPad {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 140px;
            height: 140px;
            pointer-events: auto;
        }
        .steering-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .steering-arrow {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.1s;
        }
        .steering-arrow:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.9);
        }
        #leftArrow {
            left: 5px;
            top: 50%;
            transform: translateY(-50%);
        }
        #rightArrow {
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        /* 🚀 ACCELERATION - SAĞ ALT */
        #accelPad {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 140px;
            height: 140px;
            pointer-events: auto;
        }
        .accel-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .accel-arrow {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.1s;
        }
        .accel-arrow:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.9);
        }
        #upArrow {
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
        }
        #downArrow {
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* 🎮 VR BUTTON - Gizli, sadece VR var ise göster */
        #vrBtn {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 50px;  /* 60→50 */
            height: 50px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            pointer-events: auto;
            display: none;  /* Başlangıçta gizli! */
            align-items: center;
            justify-content: center;
            font-size: 20px;  /* 24→20 */
            cursor: pointer;
            transition: all 0.2s;
            z-index: 101;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        #vrBtn:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.95);
        }
        #vrBtn.vr-active {
            background: rgba(100, 255, 100, 0.3);
            border-color: rgba(100, 255, 100, 0.5);
        }
        
        /* Desktop'ta kontrolleri gizle */
        @media (min-width: 768px) {
            #cameraBtn, #steeringPad, #accelPad {
                display: none;
            }
        }

        // ============ YENİ: SHADER KODLARI ============
        const fluidVertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fluidFragmentShader = `
            precision highp float;
            
            varying vec2 vUv;
            uniform sampler2D uTexture;
            uniform sampler2D uNextTexture;
            uniform sampler2D uPourTexture;
            uniform float uTime;
            uniform float uFlowSpeed;
            uniform float uWaveAmplitude;
            uniform float uFluidIntensity;
            uniform vec2 uResolution;
            uniform float uTransition;
            uniform bool uIsTransitioning;
            uniform float uMirrorMode;
            uniform float uColorTemp;
            uniform float uPourEffectIntensity;
            
            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
            }
            
            float noise(vec2 st) {
                vec2 i = floor(st);
                vec2 f = fract(st);
                float a = random(i);
                float b = random(i + vec2(1.0, 0.0));
                float c = random(i + vec2(0.0, 1.0));
                float d = random(i + vec2(1.0, 1.0));
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
            }
            
            float fbm(vec2 st, int octaves) {
                float value = 0.0;
                float amplitude = 0.6;
                for (int i = 0; i < 8; i++) {
                    if (i >= octaves) break;
                    value += amplitude * noise(st);
                    st *= 2.2;
                    amplitude *= 0.55;
                }
                return value;
            }
            
            vec2 applyMirror(vec2 uv, float mode) {
                if (mode < 1.0) {
                    return uv;
                } else if (mode < 2.0) {
                    return vec2(1.0 - uv.x, uv.y);
                } else if (mode < 3.0) {
                    return vec2(uv.x, 1.0 - uv.y);
                } else {
                    return vec2(1.0 - uv.x, 1.0 - uv.y);
                }
            }
            
            vec3 applyColorTemp(vec3 color, float temp) {
                if (temp > 1.0) {
                    float warmth = temp - 1.0;
                    color.r += warmth * 0.3;
                    color.g += warmth * 0.15;
                } else {
                    float coolness = 1.0 - temp;
                    color.b += coolness * 0.3;
                    color.g += coolness * 0.1;
                }
                return clamp(color, 0.0, 1.0);
            }
            
            void main() {
                vec2 st = vUv;
                
                // 🎯 SEAM SMOOTHER: UV kenarlarında yumuşak geçiş!
                float seamBlend = 0.02;  // Kenar yumuşatma miktarı
                float edgeDistX = min(st.x, 1.0 - st.x);
                float edgeDistY = min(st.y, 1.0 - st.y);
                float edgeFactor = smoothstep(0.0, seamBlend, min(edgeDistX, edgeDistY));
                
                // UV DÜZELTME: 1.82:1 -> 2:1 oranına ayarlama
                st.y = st.y * 0.91 + 0.045;
                
                float time = uTime * uFlowSpeed;
                
                vec2 mirroredSt = applyMirror(st, uMirrorMode);
                
                vec4 pourSample = texture2D(uPourTexture, st + time * 0.05);
                vec4 pourSample2 = texture2D(uPourTexture, st * 1.3 - time * 0.03);
                float displacement = (pourSample.r + pourSample.g + pourSample.b) / 3.0;
                float displacement2 = (pourSample2.r + pourSample2.g + pourSample2.b) / 3.0;
                float combinedDisplacement = mix(displacement, displacement2, 0.5);
                
                vec2 flow1 = vec2(sin(st.x * 3.0 + time * 0.8), cos(st.y * 3.0 + time * 0.8)) * 0.35;
                vec2 flow2 = vec2(cos(st.x * 6.0 - time * 0.6), sin(st.y * 6.0 - time * 0.6)) * 0.25;
                vec2 flow3 = vec2(sin(st.x * 1.5 + time * 1.2), cos(st.y * 1.5 - time * 1.0)) * 0.2;
                
                // Pour efekt intensity ile çarp
                vec2 totalFlow = (flow1 + flow2 + flow3) * combinedDisplacement * uFluidIntensity * 0.8 * uPourEffectIntensity;
                
                float wave1 = sin(st.x * 8.0 + time * 2.5) * uWaveAmplitude * 0.08;  // 0.025 → 0.08 (3x!)
                float wave2 = cos(st.y * 7.0 - time * 2.0) * uWaveAmplitude * 0.08;  // 0.025 → 0.08 (3x!)
                float wave3 = sin(st.x * 4.0 + st.y * 4.0 + time * 1.8) * uWaveAmplitude * 0.05;  // 0.015 → 0.05 (3x!)
                
                // Wave'ler POUR'dan bağımsız - her zaman aktif!

                float turbulence1 = fbm(st * 2.0 + time * 0.3, 4);

                totalFlow += vec2(turbulence1, turbulence2) * 0.03 * uFluidIntensity * uPourEffectIntensity;

                vec2 center = vec2(0.5, 0.5);

                );
                
                vec2 distortedUV = mirroredSt + totalFlow + aliveFlow + permanentWave;

        // ============ YENİ: TEKSTÜR YÜKLEME FONKSİYONLARI ============
        const textureLoader = new THREE.TextureLoader();

        function loadNextTexture() {

            const index = texturesInQueue.shift();

                textureLoader.load(UNIVERSE_TEXTURE_URLS[index], (texture) => {

        // 🎲 SHUFFLE FONKSİYONLARI
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        function getRandomUniverseIndex() {
            // Yüklenmiş texture'ları bul
            const availableIndices = [];
            for (let i = 0; i < universeTextures.length; i++) {
                if (universeTextures[i]) {
                    availableIndices.push(i);
                }
            }
            
            if (availableIndices.length === 0) return 0;
            
            // Queue boşsa veya ilk kez → Shuffle et!
            if (universeShuffleQueue.length === 0) {
                universeShuffleQueue = shuffleArray(availableIndices);
            }
            
            // Queue'dan sıradaki texture'ı al
            const nextIndex = universeShuffleQueue.shift();
            
            return nextIndex;
        }
        
        function getRandomPourIndex() {
            // Yüklenmiş pour texture'ları bul
            const availableIndices = [];
            for (let i = 0; i < pourTextures.length; i++) {

            if (availableIndices.length === 0) return 0;
            
            // Queue boşsa → Shuffle et!
            if (pourShuffleQueue.length === 0) {
                pourShuffleQueue = shuffleArray(availableIndices);
            }
            
            // Queue'dan sıradaki pour texture'ı al
            const nextIndex = pourShuffleQueue.shift();
            
            return nextIndex;
        }

        function updateFluidSkybox() {
            if (!fluidMaterial) return;
            
            const currentTime = Date.now();
            const cycleTime = (currentTime - cycleStartTime) % CYCLE_DURATION;
            
            // ═══════════════════════════════════════════════════════
            // MÜKEMMEL DÖNGÜ SİSTEMİ
            // ═══════════════════════════════════════════════════════
            
            // 🎲 Pour texture seçimi - Shuffle queue'dan!
            if (cycleTime < 100) {
                currentPourIndex = getRandomPourIndex();
                if (pourTextures[currentPourIndex]) {
                    fluidMaterial.uniforms.uPourTexture.value = pourTextures[currentPourIndex];
                }
            }
            
            if (cycleTime < PURE_SPACE_DURATION) {
                // Bu if artık çalışmaz çünkü PURE_SPACE_DURATION = 0
                // Ama kod uyumluluğu için bırakıyorum
                pourEffectIntensity = 0.0;
                waveEffectIntensity = 0.0;
                fluidMaterial.uniforms.uWaveAmplitude.value = 0.0;
                fluidMaterial.uniforms.uFluidIntensity.value = 0.0;
                
            } else if (cycleTime < POUR_FADE_IN_START + POUR_FADE_IN_DURATION) {
                // ▶ 10-20s: POUR + WAVE FADE IN
                const fadeProgress = (cycleTime - POUR_FADE_IN_START) / POUR_FADE_IN_DURATION;
                const smoothProgress = 0.5 - 0.5 * Math.cos(fadeProgress * Math.PI); // Sine easing
                
                pourEffectIntensity = smoothProgress;
                waveEffectIntensity = smoothProgress;
                
                fluidMaterial.uniforms.uWaveAmplitude.value = waveAmplitude * smoothProgress;
                fluidMaterial.uniforms.uFluidIntensity.value = fluidIntensity * smoothProgress;
                
            } else if (cycleTime < POUR_FADE_IN_START + POUR_FADE_IN_DURATION + POUR_FULL_DURATION) {
                // ▶ 20-25s: POUR + WAVE TAM GÖRÜNÜR
                pourEffectIntensity = 1.0;
                waveEffectIntensity = 1.0;
                
                fluidMaterial.uniforms.uWaveAmplitude.value = waveAmplitude;
                fluidMaterial.uniforms.uFluidIntensity.value = fluidIntensity;
                
            } else if (cycleTime < POUR_FADE_OUT_START + POUR_FADE_OUT_DURATION) {
                // ▶ 25-35s: POUR FADE OUT + SPACE BLEND (PARALEL)
                const fadeProgress = (cycleTime - POUR_FADE_OUT_START) / POUR_FADE_OUT_DURATION;
                const smoothProgress = 0.5 - 0.5 * Math.cos(fadeProgress * Math.PI); // Sine easing
                
                // Pour ve wave geri çekiliyor (AYNI pour texture)
                pourEffectIntensity = 1.0 - smoothProgress;
                waveEffectIntensity = 1.0 - smoothProgress;
                
                fluidMaterial.uniforms.uWaveAmplitude.value = waveAmplitude * (1.0 - smoothProgress);
                fluidMaterial.uniforms.uFluidIntensity.value = fluidIntensity * (1.0 - smoothProgress);
                
                // Space blend başlatma (ilk kez - sadece bir kez çalışsın)
                if (fadeProgress < 0.01 && !fluidMaterial.uniforms.uIsTransitioning.value) {

        function createPath() {
            checkpoints = roadData.checkpoints.map(cp => 
                new THREE.Vector3(
                    cp.position.x * roadScale, 
                    cp.position.y * roadScale, 
                    cp.position.z * roadScale
                )
            );

            const points = [];
            for (let i = 0; i < checkpoints.length; i++) {
                const cp1 = checkpoints[i];
                const cp2 = checkpoints[(i + 1) % checkpoints.length];
                const dist = cp1.distanceTo(cp2);
                const heightDiff = Math.abs(cp2.y - cp1.y);
                
                const baseSegments = Math.max(100, Math.floor(dist / 0.1));
                const heightBonus = Math.floor(heightDiff * 30);
                const segments = baseSegments + heightBonus;
                
                for (let j = 0; j < segments; j++) {
                    const t = j / segments;
                    const point = new THREE.Vector3().lerpVectors(cp1, cp2, t);
                    points.push(point);
                }
            }

            pathCurve = new THREE.CatmullRomCurve3(points, true, 'catmullrom', 0.002);
        }

            function createTextTexture(text, width = isMobile ? 1024 : 2048, height = isMobile ? 512 : 1024) {  // 📱 Mobilde yarı boyut!
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, width, height);
                
                const lines = getManualLines(text);
                const lineCount = lines.length;
                
                // MİNİMUM PADDING
                const paddingX = 1;
                const paddingY = 1;
                const usableWidth = width - (paddingX * 2);
                const usableHeight = height - (paddingY * 2);
                
                // BÜYÜK BAŞLANGIÇ FONTLARI!
                let fontSize;
                if (lineCount <= 2) fontSize = 380;
                else if (lineCount <= 3) fontSize = 340;
                else if (lineCount <= 4) fontSize = 300;
                else if (lineCount <= 5) fontSize = 270;
                else if (lineCount <= 6) fontSize = 240;
                else if (lineCount <= 7) fontSize = 220;
                else if (lineCount <= 8) fontSize = 200;
                else if (lineCount <= 9) fontSize = 180;
                else if (lineCount <= 10) fontSize = 165;
                else fontSize = 150;
                
                const lineHeightMultiplier = 1.02; // Sıkı!
                
                // En uzun satırı bul
                ctx.font = `bold ${fontSize}px Arial`;
                let maxLineWidth = 0;
                let longestLine = '';
                lines.forEach(line => {
                    const lineWidth = ctx.measureText(line).width;
                    if (lineWidth > maxLineWidth) {
                        maxLineWidth = lineWidth;
                        longestLine = line;
                    }
                });
                
                // GENİŞLİK KONTROLÜ - Dikkatli!
                while (maxLineWidth > usableWidth && fontSize > 50) {
                    fontSize -= 2;
                    ctx.font = `bold ${fontSize}px Arial`;
                    maxLineWidth = ctx.measureText(longestLine).width;
                }
                
                // YÜKSEKLİK KONTROLÜ - Dikkatli!
                let lineHeight = fontSize * lineHeightMultiplier;
                let totalTextHeight = lineCount * lineHeight;
                
                while (totalTextHeight > usableHeight && fontSize > 50) {
                    fontSize -= 2;
                    lineHeight = fontSize * lineHeightMultiplier;
                    totalTextHeight = lineCount * lineHeight;
                }
                
                // Final ayarlar
                ctx.fillStyle = '#FFFFFF';
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Satırları dikey ortala ve yaz - paddingY kullan!
                const startY = paddingY + (usableHeight - totalTextHeight) / 2 + lineHeight / 2;
                
                lines.forEach((line, index) => {
                    const y = startY + (index * lineHeight);
                    ctx.fillText(line, width / 2, y);
                });
                
                // DEBUG
                
                // Texture oluştur
                const texture = new THREE.CanvasTexture(canvas);
                texture.encoding = THREE.sRGBEncoding;
                texture.needsUpdate = true;
                
                return texture;
            }

        function findNearestPointOnPath(position) {
            if (!pathCurve) return { t: 0, point: position, distance: 0 };
            
            let minDist = Infinity;
            let bestT = 0;
            let bestPoint = null;
            
            // ÇOK DAHA FAZLA SAMPLE! (200 → 500)
            const samples = 500;
            for (let i = 0; i < samples; i++) {
                const t = i / samples;
                const point = pathCurve.getPoint(t);
                
                // 🚨 FARKLI KAT KONTROLÜ!
                const heightDiff = Math.abs(point.y - position.y);
                
                // Yükseklik farkı 3 birimden fazlaysa IGNORE ET! (Farklı kat!)
                if (heightDiff > 3.0) continue;
                
                const dist = position.distanceTo(point);
                
                if (dist < minDist) {
                    minDist = dist;
                    bestT = t;
                    bestPoint = point;
                }
            }
            
            // İKİNCİ AŞAMA: En yakın noktanın etrafında DAHA HASSAS arama!
            if (bestPoint) {
                const refineSamples = 50;
                const refineRange = 2.0 / samples;
                
                for (let i = 0; i < refineSamples; i++) {
                    const offset = (i / refineSamples - 0.5) * refineRange;
                    const t = Math.max(0, Math.min(1, bestT + offset));
                    const point = pathCurve.getPoint(t);
                    
                    // 🚨 Yine farklı kat kontrolü!
                    const heightDiff = Math.abs(point.y - position.y);
                    if (heightDiff > 3.0) continue;
                    
                    const dist = position.distanceTo(point);
                    
                    if (dist < minDist) {
                        minDist = dist;
                        bestT = t;
                        bestPoint = point;
                    }
                }
            }
            
            return { t: bestT, point: bestPoint, distance: minDist };
        }

                const gamepad = gamepads[gamepadIndex];
                if (!gamepad) return;
                
                // Left stick - Direksiyon (X axis)
                const stickX = gamepad.axes[0];  // Sol/Sağ
                if (Math.abs(stickX) > 0.15) {  // Dead zone
                    mobileControls.left = stickX < -0.15;
                    mobileControls.right = stickX > 0.15;
                } else {
                    mobileControls.left = false;
                    mobileControls.right = false;
                }
                
                // Right trigger (RT) - İleri (axis 7 veya button 7)
                const rightTrigger = gamepad.buttons[7] ? gamepad.buttons[7].value : 0;
                mobileControls.forward = rightTrigger > 0.1;
                
                // Left trigger (LT) - Geri (axis 6 veya button 6)
                const leftTrigger = gamepad.buttons[6] ? gamepad.buttons[6].value : 0;
                mobileControls.backward = leftTrigger > 0.1;
                
                // A button (button 0) - İleri alternatif
                if (gamepad.buttons[0] && gamepad.buttons[0].pressed) {
                    mobileControls.forward = true;
                }
                
                // B button (button 1) - Geri alternatif
                if (gamepad.buttons[1] && gamepad.buttons[1].pressed) {
                    mobileControls.backward = true;
                }
                
                // Y button (button 3) - Kamera değiştir
                if (gamepad.buttons[3] && gamepad.buttons[3].pressed && !gamepad.buttons[3].wasPressed) {

            // DESKTOP KEYBOARD
            document.addEventListener('keydown', (event) => {
                keys[event.code] = true;
                if (event.code === 'KeyC') {
                    cameraMode = (cameraMode + 1) % 3;
                    resetCameraForMode(cameraMode);
                }
            });
            
            document.addEventListener('keyup', (event) => { 
                keys[event.code] = false; 
            });

            if (renderer && renderer.domElement) {
                renderer.domElement.addEventListener('mousedown', (event) => {
                    isMouseDown = true;
                    mouseX = event.clientX;
                    mouseY = event.clientY;
                });

                document.addEventListener('mousemove', (event) => {
                    if (isMouseDown) {
                        const deltaX = event.clientX - mouseX;
                        const deltaY = event.clientY - mouseY;
                        
                        if (cameraMode === 0) {
                            cameraYaw -= deltaX * 0.005;
                            cameraPitch = Math.max(-Math.PI/2.3, Math.min(Math.PI/3, cameraPitch + deltaY * 0.005));
                        } else if (cameraMode === 1) {
                            cameraYaw -= deltaX * 0.005;
                            cameraPitch = Math.max(-Math.PI/3, Math.min(Math.PI/6, cameraPitch + deltaY * 0.005));
                        } else if (cameraMode === 2) {
                            cameraTheta -= deltaX * 0.01;
                            cameraPhi = Math.max(0.1, Math.min(Math.PI - 0.1, cameraPhi + deltaY * 0.01));
                        }
                        
                        mouseX = event.clientX;
                        mouseY = event.clientY;
                    }
                });

                document.addEventListener('mouseup', () => { 
                    isMouseDown = false; 
                });

                renderer.domElement.addEventListener('wheel', (event) => {

                    const zoomFactor = event.deltaY > 0 ? 1.05 : 0.95;
                    camera.fov = Math.max(20, Math.min(120, camera.fov * zoomFactor));
                    camera.updateProjectionMatrix();
                    
                    if (cameraMode === 0) {
                        cameraDistance = Math.max(5, Math.min(50, cameraDistance + event.deltaY * 0.05));
                    } else if (cameraMode === 1) {
                        cameraDistance = Math.max(0, Math.min(10, cameraDistance + event.deltaY * 0.02));
                    } else if (cameraMode === 2) {
                        cameraRadius = Math.max(10, Math.min(500, cameraRadius + event.deltaY * 0.5));
                    }
                }, { passive: false });
            }
        }

        function updateCar() {
            if (!car) return;
            
            // Desktop + Mobile kontrol birleşimi
            const isForward = keys['ArrowUp'] || keys['KeyW'] || mobileControls.forward;
            const isBackward = keys['ArrowDown'] || keys['KeyS'] || mobileControls.backward;
            const isLeft = keys['ArrowLeft'] || keys['KeyA'] || mobileControls.left;
            const isRight = keys['ArrowRight'] || keys['KeyD'] || mobileControls.right;
            
            if (isForward) {
                carSpeed = Math.min(carSpeed + acceleration, maxSpeed);
            } else if (isBackward) {
                carSpeed = Math.max(carSpeed - acceleration, -maxSpeed * 0.5);
            } else {
                if (carSpeed > 0) carSpeed = Math.max(0, carSpeed - deceleration);
                else if (carSpeed < 0) carSpeed = Math.min(0, carSpeed + deceleration);
            }

            if (isLeft) {
                turnSpeed = Math.max(turnSpeed - 0.0015, -maxTurnSpeed);
            } else if (isRight) {
                turnSpeed = Math.min(turnSpeed + 0.0015, maxTurnSpeed);
            } else {
                turnSpeed *= 0.88;
            }

            if (Math.abs(carSpeed) > 0.001) {
                car.rotation.y += turnSpeed * (carSpeed / maxSpeed) * 1.5;
                const moveX = Math.sin(car.rotation.y) * carSpeed;
                const moveZ = Math.cos(car.rotation.y) * carSpeed;
                car.position.x -= moveX;
                car.position.z -= moveZ;
                smoothCarPosition.x = car.position.x;
                smoothCarPosition.z = car.position.z;
            }
            
            const nearest = findNearestPointOnPath(car.position);
            
            if (nearest && nearest.point) {
                const maxDistance = 5.5;
                const currentDistance = nearest.distance;
                
                if (currentDistance > maxDistance) {
                    const overDistance = currentDistance - maxDistance;
                    const distanceChange = currentDistance - lastRoadDistance;
                    const smoothOverDistance = Math.abs(distanceChange) < 0.2 ? overDistance : overDistance * 0.7;
                    
                    const pullX = (nearest.point.x - car.position.x) / currentDistance;
                    const pullZ = (nearest.point.z - car.position.z) / currentDistance;
                    
                    roadPullAccumulator.x += pullX * smoothOverDistance * 0.08;
                    roadPullAccumulator.y += pullZ * smoothOverDistance * 0.08;
                    roadPullAccumulator.x *= 0.85;
                    roadPullAccumulator.y *= 0.85;
                    
                    car.position.x += roadPullAccumulator.x;
                    car.position.z += roadPullAccumulator.y;
                    smoothCarPosition.x = car.position.x;
                    smoothCarPosition.z = car.position.z;
                } else {
                    roadPullAccumulator.x *= 0.9;
                    roadPullAccumulator.y *= 0.9;
                }
                
                lastRoadDistance = currentDistance;
                
                // 🎯 ULTRA PROFESYONEL RAMPA SİSTEMİ!
                const currentRoadHeight = nearest.point.y;
                
                // 1️⃣ ÇİFT LOOKAHEAD - Yakın + Uzak! 🎯 ARTTIRILDI!
                const nearLookahead = 4.0; // 2.5 → 4.0 Daha erken gör!
                const farLookahead = 8.0;  // 5.0 → 8.0 Çok daha erken!
                
                // Yakın lookahead - ÖNÜNE BAK!
                const nearPos = new THREE.Vector3(
                    car.position.x + Math.sin(car.rotation.y) * nearLookahead,
                    car.position.y,
                    car.position.z + Math.cos(car.rotation.y) * nearLookahead
                );
                const nearNearest = findNearestPointOnPath(nearPos);
                const nearHeight = nearNearest && nearNearest.point ? nearNearest.point.y : currentRoadHeight;
                
                // Uzak lookahead - ÖNÜNE BAK!
                const farPos = new THREE.Vector3(
                    car.position.x + Math.sin(car.rotation.y) * farLookahead,
                    car.position.y,
                    car.position.z + Math.cos(car.rotation.y) * farLookahead
                );
                const farNearest = findNearestPointOnPath(farPos);
                const farHeight = farNearest && farNearest.point ? farNearest.point.y : currentRoadHeight;
                
                // 2️⃣ RAMPA ANALİZİ
                const nearChange = nearHeight - currentRoadHeight;
                const farChange = farHeight - currentRoadHeight;
                const totalChange = farHeight - currentRoadHeight;
                
                // Rampa tipleri
                const isStrongClimb = totalChange > 0.4; // Güçlü yukarı rampa
                const isMildClimb = totalChange > 0.15 && totalChange <= 0.4; // Hafif yukarı
                const isStrongDescend = totalChange < -0.4; // Güçlü aşağı rampa
                const isMildDescend = totalChange < -0.15 && totalChange >= -0.4; // Hafif aşağı
                const isFlat = Math.abs(totalChange) <= 0.15; // Düz yol
                
                // 3️⃣ AKILLI HEDEF YÜKSEKLİK + DOĞRU OFFSET!
                let targetHeight;
                let offset = 0.25; // 🎯 0.15 → 0.25 Biraz daha yukarı (ama hala düşük!)
                let smoothMultiplier = 1.0;
                
                if (isStrongClimb) {
                    // GÜÇLÜ YUKARI RAMPA - SADECE İLERİYE BAK! (Geçmiş umurumuzda değil!)
                    targetHeight = farHeight * 0.65 + nearHeight * 0.35 + currentRoadHeight * 0.0;  // 🎯 Current = 0!
                    smoothMultiplier = 0.95;  // 1.2 → 0.95 Biraz daha hızlı!
                    
                } else if (isMildClimb) {
                    // HAFİF YUKARI RAMPA - İLERİYE ODAKLAN!
                    targetHeight = farHeight * 0.55 + nearHeight * 0.45 + currentRoadHeight * 0.0;  // 🎯 Current = 0!
                    smoothMultiplier = 1.0;  // 1.1 → 1.0 Dengeli!
                    
                } else if (isStrongDescend) {
                    // GÜÇLÜ AŞAĞI RAMPA - İLERİYE BAK VE HIZLI İN!
                    targetHeight = farHeight * 0.75 + nearHeight * 0.15 + currentRoadHeight * 0.10;  // 🎯 Far dominant!
                    smoothMultiplier = 0.8;  // 1.5 → 0.8 HIZLI İNİŞ!
                    
                } else if (isMildDescend) {
                    // HAFİF AŞAĞI RAMPA - İLERİYİ TAKİP ET!
                    targetHeight = farHeight * 0.65 + nearHeight * 0.20 + currentRoadHeight * 0.15;  // 🎯 Far ağırlıklı!
                    smoothMultiplier = 0.9;  // 1.3 → 0.9 Hızlı iniş!
                    
                } else {
                    // DÜZ YOL
                    targetHeight = currentRoadHeight;
                    smoothMultiplier = 1.0;
                }
                
                const desiredHeight = targetHeight + offset;
                
                // 🎯 ÖNCEDEn HAZIRLIK SİSTEMİ - Yumuşak hazırlık!
                let preemptiveBoost = 0;
                if (isStrongClimb && totalChange > 0.5) {
                    // Güçlü rampa - hafif önceden hazırlık
                    preemptiveBoost = totalChange * 0.15;  // 🎯 0.25 → 0.15 Daha yumuşak!
                } else if (isMildClimb && totalChange > 0.2) {
                    // Hafif rampa - minimal hazırlık
                    preemptiveBoost = totalChange * 0.10;  // 🎯 0.15 → 0.10
                } else if (isStrongDescend && totalChange < -0.5) {
                    // Güçlü iniş - hızlı in!
                    preemptiveBoost = totalChange * 0.30;
                } else if (isMildDescend && totalChange < -0.2) {
                    // Hafif iniş - erken in!
                    preemptiveBoost = totalChange * 0.20;
                }
                
                const finalDesiredHeight = desiredHeight + preemptiveBoost;
                
                // 4️⃣ ULTRA HASSAS SMOOTH - 🎯 RAMPA İÇİN OPTIMIZE!
                const heightDiff = finalDesiredHeight - car.position.y;  // 🎯 ÖNCEDEn BOOST ile!
                const absDiff = Math.abs(heightDiff);
                
                // Araba hızına göre bonus
                const speed = Math.abs(carSpeed);
                const speedBonus = Math.min(speed * 50, 0.3); // Max +0.3
                
                // 🎯 RAMPA BONUS - Dengeli! 
                let responseMultiplier = 1.0;
                if (isStrongClimb || isMildClimb) {
                    responseMultiplier = 1.3;  // 1.5 → 1.3 Dengeli yükseliş!
                } else if (isStrongDescend || isMildDescend) {
                    responseMultiplier = 1.8;  // 2.0 → 1.8 Hızlı iniş!
                }
                
                let baseSmoothFactor;
                if (absDiff > 2.5) {
                    baseSmoothFactor = 0.25;  // 0.18 → 0.25 Çok daha hızlı!
                } else if (absDiff > 1.5) {
                    baseSmoothFactor = 0.22;  // 0.15 → 0.22
                } else if (absDiff > 0.8) {
                    baseSmoothFactor = 0.18;  // 0.12 → 0.18
                } else if (absDiff > 0.4) {
                    baseSmoothFactor = 0.15;  // 0.10 → 0.15
                } else if (absDiff > 0.15) {
                    baseSmoothFactor = 0.12;  // 0.08 → 0.12
                } else {
                    baseSmoothFactor = 0.08;  // 0.06 → 0.08
                }
                
                // Final smooth = (base * multiplier * responseMultiplier) + speed bonus
                const finalSmoothFactor = Math.min((baseSmoothFactor * smoothMultiplier * responseMultiplier) + speedBonus, 0.55);  // 🎯 0.75 → 0.55 Dengeli!
                
                // 5️⃣ UPDATE
                car.position.y += heightDiff * finalSmoothFactor;
                smoothCarPosition.y = car.position.y;
                smoothCarHeight = car.position.y;
                
                // 6️⃣ KUSURSUZ PITCH - Son ayarlar!
                const carLength = 2.5; // Arabanın yarı uzunluğu
                
                // ARKA tekerlek pozisyonu
                const rearWheelPos = new THREE.Vector3(
                    car.position.x - Math.sin(car.rotation.y) * carLength,
                    car.position.y,
                    car.position.z - Math.cos(car.rotation.y) * carLength
                );
                const rearNearest = findNearestPointOnPath(rearWheelPos);
                const rearRoadHeight = rearNearest && rearNearest.point ? rearNearest.point.y : currentRoadHeight;
                
                // ÖN tekerlek pozisyonu
                const frontWheelPos = new THREE.Vector3(
                    car.position.x + Math.sin(car.rotation.y) * carLength,
                    car.position.y,
                    car.position.z + Math.cos(car.rotation.y) * carLength
                );
                const frontNearest = findNearestPointOnPath(frontWheelPos);
                const frontRoadHeight = frontNearest && frontNearest.point ? frontNearest.point.y : currentRoadHeight;
                
                // Pitch'i ön ve arka yükseklik farkından hesapla - KUSURSUZ!
                const heightDifference = frontRoadHeight - rearRoadHeight;
                const wheelBase = carLength * 2; // Toplam araç uzunluğu
                
                if (Math.abs(heightDifference) > 0.05) {
                    // 🎯 EKSİ YOK! Pozitif yükseklik farkı = pozitif pitch = burun YUKARI!
                    let targetPitch = Math.atan2(heightDifference, wheelBase);
                    
                    // PITCH ÇARPANI - ÇOK YUMUŞAK!
                    targetPitch *= 0.40; // 🎯 0.80 → 0.40 (yarısı!)
                    
                    if (!car.userData.currentPitch) car.userData.currentPitch = 0;
                    
                    const pitchDiff = targetPitch - car.userData.currentPitch;
                    const pitchSmooth = 0.24; // Hızlı tepki
                    car.userData.currentPitch += pitchDiff * pitchSmooth;
                    
                    // Pitch limit
                    const maxPitch = Math.PI / 5.2; // 35 derece
                    car.userData.currentPitch = Math.max(-maxPitch, Math.min(maxPitch, car.userData.currentPitch));
                    
                    car.rotation.x = car.userData.currentPitch;
                } else {
                    // Düz yolda pitch yumuşak sıfırla
                    if (!car.userData.currentPitch) car.userData.currentPitch = 0;
                    car.userData.currentPitch *= 0.88;
                    car.rotation.x = car.userData.currentPitch;
                }
            }
        }

        function updateCamera() {
            if (!car || !camera) return;
            const lerpFactor = 0.04;
            
            if (cameraMode === 0) {
                const followDistance = cameraDistance;
                const cameraHeight = 8;
                const carDirection = new THREE.Vector3(0, 0, 1);
                carDirection.applyQuaternion(car.quaternion);
                carDirection.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraYaw);
                const cameraOffset = carDirection.multiplyScalar(followDistance);
                cameraOffset.y = cameraHeight + cameraPitch * 10;
                targetCameraPosition.copy(car.position).add(cameraOffset);
                targetCameraPosition.y = Math.max(2, targetCameraPosition.y);
                
                camera.position.lerp(targetCameraPosition, lerpFactor);
                
                const lookAhead = new THREE.Vector3(0, 0, -1);
                lookAhead.applyQuaternion(car.quaternion);
                targetLookAt.copy(car.position).add(lookAhead.multiplyScalar(10));
                targetLookAt.y = Math.max(1, car.position.y + 2);
                
                if (!currentLookAt.x && !currentLookAt.y && !currentLookAt.z) {
                    currentLookAt.copy(targetLookAt);
                }
                currentLookAt.lerp(targetLookAt, lerpFactor);
                camera.lookAt(currentLookAt);
                
            } else if (cameraMode === 1) {
                const cockpitOffset = new THREE.Vector3(0, 1.8, -2.8);
                cockpitOffset.applyQuaternion(car.quaternion);
                targetCameraPosition.copy(car.position).add(cockpitOffset);
                targetCameraPosition.y = Math.max(2, targetCameraPosition.y);
                camera.position.lerp(targetCameraPosition, lerpFactor * 6);
                
                const lookDirection = new THREE.Vector3(
                    Math.sin(cameraYaw),
                    cameraPitch,
                    -Math.cos(cameraYaw)
                );
                lookDirection.normalize();
                lookDirection.applyQuaternion(car.quaternion);
                targetLookAt.copy(camera.position).add(lookDirection.multiplyScalar(100));
                targetLookAt.y = Math.max(0.5, targetLookAt.y);
                
                if (!currentLookAt.x && !currentLookAt.y && !currentLookAt.z) {
                    currentLookAt.copy(targetLookAt);
                }
                currentLookAt.lerp(targetLookAt, lerpFactor * 6);
                camera.lookAt(currentLookAt);
                
            } else if (cameraMode === 2) {
                const x = car.position.x + cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
                const y = car.position.y + cameraRadius * Math.cos(cameraPhi);
                const z = car.position.z + cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
                targetCameraPosition.set(x, Math.max(2, y), z);
                camera.position.lerp(targetCameraPosition, lerpFactor);
                
                targetLookAt.copy(car.position);
                if (!currentLookAt.x && !currentLookAt.y && !currentLookAt.z) {
                    currentLookAt.copy(targetLookAt);
                }
                currentLookAt.lerp(targetLookAt, lerpFactor);
                camera.lookAt(currentLookAt);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 📱 SAYFA KAPANIRKEN TEMİZLİK
        window.addEventListener('beforeunload', () => {
            // Texture'ları temizle
            universeTextures.forEach(tex => tex && tex.dispose());
            pourTextures.forEach(tex => tex && tex.dispose());
            
            // Geometry'leri temizle
            scene.traverse((obj) => {
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) {
                        obj.material.forEach(mat => mat.dispose());
                    } else {
                        obj.material.dispose();
                    }
                }
            });
            
            // Renderer'ı temizle
            renderer.dispose();
        });

        // 📱 HAFIZA İZLEME VE TEMİZLİK SİSTEMİ
        let lastMemoryCheck = Date.now();
        function checkMemory() {
            // Her 5 saniyede bir hafıza kontrolü
            if (Date.now() - lastMemoryCheck > 5000) {
                lastMemoryCheck = Date.now();
                
                // Renderer'ı temizle
                if (renderer.info) {
                    renderer.info.reset();
                }
                
                // 📱 MOBİL: Kullanılmayan texture'ları temizle
                if (isMobile && activeTextureIndices.size > MAX_LOADED_TEXTURES) {
                    // En eski texture'ları bul ve temizle
                    const toRemove = activeTextureIndices.size - MAX_LOADED_TEXTURES;
                    let removed = 0;
                    activeTextureIndices.forEach(key => {
                        if (removed >= toRemove) return;
                        const type = key[0];
                        const index = parseInt(key.substring(1));
                        
                        // Aktif kullanımda olmayan texture'ı temizle
                        if (type === 'u' && index !== currentUniverseIndex && index !== nextUniverseIndex) {
                            if (universeTextures[index]) {
                                universeTextures[index].dispose();
                                delete universeTextures[index];
                                activeTextureIndices.delete(key);
                                removed++;
                            }
                        }
                    });
                }
            }
        }

        // ============ YENİ: AKIŞKAN SKYBOX BAŞLAT ============
        loadFluidTextures();
        
        // 📱 LOADING EKRANI KALDIRMA
        let assetsLoaded = {
            car: false,
            track: false,
            skybox: false
        };
        
        function checkAllLoaded() {
            if (assetsLoaded.car && assetsLoaded.track && assetsLoaded.skybox) {
                setTimeout(() => {
                    const loading = document.getElementById('loading');
                    if (loading) {
                        loading.style.transition = 'opacity 0.5s';
                        loading.style.opacity = '0';
                        setTimeout(() => loading.style.display = 'none', 500);
                    }
                }, 500);
            }
        }

        let frameCounter = 0;
        function animate() {
            requestAnimationFrame(animate);
            frameCounter++;
            
            // 📱 Her 300 frame'de hafıza kontrolü (5 saniye)
            if (frameCounter % 300 === 0) {
                checkMemory();
            }
            
            // ✨ Yıldızlar yavaşça dönüyor
            stars.rotation.y += 0.0002;
            
            // 💫 Yıldız animasyonu - her 5 frame (daha az sık!)
            if (frameCounter % 5 === 0) {
                const starColors = stars.geometry.attributes.color.array;
                const time = Date.now() * 0.0001;
                
                for (let i = 0; i < starColors.length; i += 3) {
                    const phase = (time + i * 0.1) % (Math.PI * 2);
                    const brightness = 0.6 + Math.sin(phase) * 0.4;
                    starColors[i] = starColors[i + 1] = starColors[i + 2] = brightness;
                }
                stars.geometry.attributes.color.needsUpdate = true;
            }
            
            // ============ YENİ: AKIŞKAN SKYBOX GÜNCELLE ============
            updateFluidSkybox();
            
            updateCar();
            updateCamera();
            
            if (car && spotLight) {
                spotLight.position.copy(car.position);
                spotLight.position.y += 25;
                spotLight.target.position.copy(car.position);
            }
            
            const delta = 0.016;
            mirrorMixers.forEach(mixer => mixer.update(delta));
            rotatingMirrors.forEach(obj => {
                obj.mesh.rotation.y += obj.rotationSpeed;
            });
            
            // 🪞 Mirror update - HER 6 FRAME (balanced!)
            if (car && mirrorMeshes.length > 0 && frameCounter % 6 === 0) {
                mirrorMeshes.forEach(mesh => mesh.visible = false);
                
                cubeCamera.position.copy(car.position);
                cubeCamera.position.y += 3;
                
                if (fluidSkybox && fluidSkybox.material) {
                    fluidSkybox.material.side = THREE.DoubleSide;
                }
                
                cubeCamera.update(renderer, scene);
                
                if (fluidSkybox && fluidSkybox.material) {
                    fluidSkybox.material.side = THREE.BackSide;
                }
                
                mirrorMeshes.forEach(mesh => mesh.visible = true);
            }
            
            // 🛣️ Road camera - HER 6 FRAME (balanced!)
            if (car && trackMesh && frameCounter % 6 === 0) {
                // 🎯 1. YOL + AYNALAR + ARABA GİZLE!
                trackMesh.visible = false;
                mirrorMeshes.forEach(mesh => mesh.visible = false);
                if (car) car.visible = false;  // ARABA GİZLİ! ✅
                
                // 🎯 2. Kamera pozisyon
                roadCubeCamera.position.copy(car.position);
                roadCubeCamera.position.y = 5;
                
                // 🎯 3. SKYBOX DOUBLESIDE
                if (fluidSkybox && fluidSkybox.material) {
                    fluidSkybox.material.side = THREE.DoubleSide;
                }
                
                // 🎯 4. GÜNCELLE - Sadece skybox!
                roadCubeCamera.update(renderer, scene);
                
                // 🎯 5. SKYBOX BACKSIDE
                if (fluidSkybox && fluidSkybox.material) {
                    fluidSkybox.material.side = THREE.BackSide;
                }
                
                // 🎯 6. YOL + AYNALAR + ARABA görünür!
                trackMesh.visible = true;
                mirrorMeshes.forEach(mesh => mesh.visible = true);
                if (car) car.visible = true;  // ARABA GÖRÜNÜR! ✅
            }
            
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
